# config/season_2026_27.yaml
# NHL 2026-27 season structure.
#
# Generated on 2026-09-21 from NHL API responses (api-web.nhle.com):
#   - dates:        /v1/standings-season (entry 20262027)
#   - alignment:    /v1/standings/now (2025-26 final), confirmed for 2026-27 by the
#                   TOR and UTA 2026-27 club schedules (4 games vs each division opponent)
#   - team IDs:     /v1/club-schedule-season/{TOR,UTA}/20262027
#   - schedule format and 84 games: counted from the TOR and UTA schedules
# All strings are quoted on purpose: YAML 1.1 turns some bare words (yes/no/on/off)
# into booleans.

season_id: 20262027
label: "2026-27"

regular_season:
  start_date: 2026-09-29
  end_date: 2027-04-10
  games_per_team: 84

# Games vs each opponent, by relationship. Optional: omit for seasons without a
# uniform format (e.g. 82-game seasons). When present, the loader checks that it
# adds up to games_per_team for every team.
schedule_format:
  division: 4
  conference_other_division: 3
  other_conference: 2

points:
  win: 2
  ot_loss: 1
  regulation_loss: 0

playoffs:
  format: "division_wildcard"   # top N per division + wild cards per conference
  division_qualifiers: 3
  wild_cards_per_conference: 2
  series_best_of: 7

conferences:
  - {abbrev: "E", name: "Eastern"}
  - {abbrev: "W", name: "Western"}

divisions:
  - {abbrev: "A", name: "Atlantic", conference: "E"}
  - {abbrev: "M", name: "Metropolitan", conference: "E"}
  - {abbrev: "C", name: "Central", conference: "W"}

  home_advantage: 27.5
  season_regression: 0.3
  shootout_as_draw: false
  margin_weight: 0.0
  initial_rating: 1500.0
tuning:
  warm_up_first: 20152016
  tuning_first: 20172018
  tuning_last: 20252026
  source: "scripts/tune_elo.py --final"

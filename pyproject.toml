[project]
name = "nhlsim"
version = "0.1.0"
description = "Monte Carlo NHL season simulator with daily-updated public projections"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Paweł Woźniak" }]
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.13.5",
    "pyyaml>=6.0.3",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nhlsim"]

[tool.uv]
# The repo lives on an exFAT drive, where hardlinks from uv's cache are impossible.
link-mode = "copy"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.format]
line-ending = "lf"

[tool.ruff.lint]
# E/F: pycodestyle + pyflakes, I: import sorting, UP: modern syntax,
# B: likely bugs, SIM: simplifications, NPY: NumPy-specific rules
select = ["E", "F", "I", "UP", "B", "SIM", "NPY"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--import-mode=importlib"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]
